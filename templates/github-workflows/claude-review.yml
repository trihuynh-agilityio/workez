name: Claude PR Review

on:
  # A new task PR (base feat/*) is reviewed as soon as it is opened or marked ready.
  pull_request:
    types: [opened, ready_for_review]
  # Anyone trusted can ask for a review by hand with an "@claude review" comment.
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # pull_request: trusted authors, not drafts, not forks, and only PRs into a feat/ branch
    # (a feature branch merging into the base branch is not reviewed automatically).
    # issue_comment: PR comments containing "@claude review" from trusted users.
    if: >
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.base.ref, 'feat/') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # read-only: Claude cannot push commits
      pull-requests: write  # needed to post review comments
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request (PR #${{ github.event.pull_request.number || github.event.issue.number }}) in ${{ github.repository }}.
            Focus only on: (1) bugs, (2) security issues, (3) missing tests.
            Do NOT modify any files or push commits. Post findings as PR comments,
            ordered by severity, citing file and line. If nothing significant, say so briefly.
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
